spring.application.name=library-management
spring.datasource.url=jdbc:h2:mem:library
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
server.port=8080
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

ollama.host=localhost
ollama.port=11434
ollama.model=gpt-oss:120b-cloud
ollama.timeout=120

spring.ai.ollama.base-url=http://${ollama.host}:${ollama.port}
spring.ai.ollama.chat.options.model=${ollama.model}
spring.ai.ollama.chat.options.temperature=0.7
